<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股技術分析</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171b23; --line: #262c38; --text: #e6e9ef; --muted: #8a93a6;
    --up: #ef4b4b; --down: #22b573; --accent: #4f8cff;
    --ma5: #f5c542; --ma20: #c77dff; --ma60: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  input { width: 140px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--panel);
    border: 1px solid var(--line); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .status { color: var(--muted); min-height: 22px; margin: 8px 0; }
  .status.err { color: var(--up); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .info { font-size: 12.5px; color: var(--muted); min-height: 40px; font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 4px 6px; }
  .info b { color: var(--text); font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
  canvas { width: 100%; height: 560px; display: block; cursor: crosshair; touch-action: pan-y; }
  .tabs { display: flex; gap: 6px; margin: 8px 4px 0; }
  .tabs button { padding: 4px 12px; font-size: 13px; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
  .signals { list-style: none; margin: 0; padding: 0; }
  .signals li { padding: 8px 4px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .signals li:last-child { border-bottom: 0; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.bull { background: rgba(239,75,75,.15); color: var(--up); }
  .tag.bear { background: rgba(34,181,115,.15); color: var(--down); }
  .tag.neu { background: rgba(138,147,166,.15); color: var(--muted); }
  h2 { font-size: 15px; margin: 2px 4px 8px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 18px; }
  @media (max-width: 640px) { canvas { height: 440px; } .card .v { font-size: 17px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 台股技術分析 <small>資料來源：台灣證券交易所（上市股票／ETF）</small></h1>

  <div class="bar">
    <input id="code" placeholder="股票代號，如 2330" inputmode="numeric" autocomplete="off">
    <select id="months">
      <option value="3">近 3 個月</option>
      <option value="6" selected>近 6 個月</option>
      <option value="12">近 12 個月</option>
    </select>
    <button class="primary" id="go">分析</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="status" id="status">輸入代號後按「分析」。已抓過的月份會快取在瀏覽器裡，第二次載入會很快。</div>

  <div id="result" hidden>
    <div class="cards" id="cards"></div>

    <div class="panel">
      <div class="info" id="info"></div>
      <canvas id="chart"></canvas>
      <div class="tabs" id="tabs">
        <button data-ind="KD" class="on">KD (9)</button>
        <button data-ind="RSI">RSI (14)</button>
        <button data-ind="MACD">MACD (12,26,9)</button>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>技術面觀察（最新交易日）</h2>
        <ul class="signals" id="signals"></ul>
      </div>
    </div>
  </div>

  <p class="note">⚠️ 本工具只是把公開資料計算成技術指標並描述現況，不構成任何投資建議；技術指標有落後性，請自行判斷。證交所有請求頻率限制，程式每次請求之間會自動間隔約 1.5 秒。</p>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const num = s => { const v = parseFloat(String(s).replace(/,/g, '')); return Number.isFinite(v) ? v : null; };
const fmt = (v, d = 2) => v == null ? '—' : v.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- 資料抓取 ----------
let lastNetAt = 0;
const CURRENT_TTL = 10 * 60 * 1000; // 當月資料快取 10 分鐘
const hasProxy = location.protocol.startsWith('http') && location.hostname === 'localhost';

// 先直連證交所；失敗時改走本機代理（serve.ps1），再失敗就退避重試
async function getJson(ym, code, onRetry) {
  const qs = `date=${ym}01&stockNo=${code}`;
  const urls = [`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?${qs}&response=json`];
  if (hasProxy) urls.push(`/twse?${qs}`);
  const delays = [3, 6, 12];
  for (let attempt = 0; ; attempt++) {
    for (const u of urls) {
      const wait = 1500 - (Date.now() - lastNetAt);
      if (wait > 0) await sleep(wait);
      lastNetAt = Date.now();
      try {
        const r = await fetch(u);
        if (r.ok) { const j = await r.json(); if (j && j.stat) return j; }
      } catch {}
    }
    if (attempt >= delays.length) throw new Error('Failed to fetch');
    for (let s = delays[attempt]; s > 0; s--) { onRetry?.(s, attempt + 1); await sleep(1000); }
  }
}

async function fetchMonth(code, y, m, onRetry) {
  const ym = `${y}${String(m).padStart(2, '0')}`;
  const key = `tw:${code}:${ym}`;
  const now = new Date();
  const isCurrent = y === now.getFullYear() && m === now.getMonth() + 1;
  const c = store.get(key);
  if (c && (!isCurrent || Date.now() - (c.at || 0) < CURRENT_TTL)) return c;

  const j = await getJson(ym, code, onRetry);
  if (j.stat !== 'OK') return { name: null, rows: [] };

  const name = (j.title || '').trim().split(/\s+/)[2] || null;
  const rows = [];
  for (const d of j.data || []) {
    const [ry, mm, dd] = d[0].split('/');
    const close = num(d[6]);
    if (close == null) continue; // 無成交
    rows.push({
      date: `${+ry + 1911}-${mm}-${dd}`,
      vol: Math.round(num(d[1]) / 1000), // 張
      open: num(d[3]), high: num(d[4]), low: num(d[5]), close,
    });
  }
  const res = { name, rows, at: Date.now() };
  store.set(key, res);
  return res;
}

// ---------- 指標 ----------
function sma(a, n) {
  const out = Array(a.length).fill(null); let s = 0;
  for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i - n]; if (i >= n - 1) out[i] = s / n; }
  return out;
}
function ema(a, n) {
  const k = 2 / (n + 1), out = []; let prev = null;
  for (let i = 0; i < a.length; i++) {
    if (a[i] == null) { out.push(null); continue; }
    prev = prev == null ? a[i] : a[i] * k + prev * (1 - k); out.push(prev);
  }
  return out;
}
function rsi(c, n = 14) {
  const out = Array(c.length).fill(null); let ag = 0, al = 0;
  for (let i = 1; i < c.length; i++) {
    const ch = c[i] - c[i - 1], g = Math.max(ch, 0), l = Math.max(-ch, 0);
    if (i <= n) { ag += g / n; al += l / n; } else { ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n; }
    if (i >= n) out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return out;
}
function kd(rows, n = 9) {
  const K = [], D = []; let k = 50, d = 50;
  rows.forEach((r, i) => {
    if (i < n - 1) { K.push(null); D.push(null); return; }
    const win = rows.slice(i - n + 1, i + 1);
    const hi = Math.max(...win.map(x => x.high)), lo = Math.min(...win.map(x => x.low));
    const rsv = hi === lo ? 50 : (r.close - lo) / (hi - lo) * 100;
    k = k * 2 / 3 + rsv / 3; d = d * 2 / 3 + k / 3; K.push(k); D.push(d);
  });
  return { K, D };
}
function macd(c) {
  const e12 = ema(c, 12), e26 = ema(c, 26);
  const dif = c.map((_, i) => i < 25 ? null : e12[i] - e26[i]);
  const dea = ema(dif, 9);
  return { dif, dea, osc: dif.map((v, i) => v == null || dea[i] == null ? null : v - dea[i]) };
}

// ---------- 狀態 ----------
let D = null, hover = null, ind = 'KD', loadToken = 0;

async function analyze(code) {
  code = code.trim().toUpperCase();
  if (!/^[0-9A-Z]{4,6}$/.test(code)) return setStatus('請輸入正確的股票代號（例如 2330、0050）', true);
  const months = +$('#months').value, token = ++loadToken;
  $('#code').value = code; $('#go').disabled = true;

  try {
    const now = new Date(), list = [];
    for (let i = months - 1; i >= 0; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      list.push([dt.getFullYear(), dt.getMonth() + 1]);
    }
    let rows = [], name = null;
    // 先抓 60 日均線所需的前置月份（多 4 個月），讓指標一開始就有值
    const warm = [];
    for (let i = months + 3; i >= months; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      warm.push([dt.getFullYear(), dt.getMonth() + 1]);
    }
    const all = [...warm, ...list];
    for (let i = 0; i < all.length; i++) {
      if (token !== loadToken) return;
      const label = `${code} ${all[i][0]}/${all[i][1]} (${i + 1}/${all.length})`;
      setStatus(`抓取資料中… ${label}`);
      const res = await fetchMonth(code, ...all[i], (s, n) => {
        if (token === loadToken) setStatus(`證交所暫時沒回應，${s} 秒後重試（第 ${n}/3 次）… ${label}`);
      });
      rows.push(...res.rows); name = res.name || name;
    }
    if (token !== loadToken) return;
    if (!rows.length) throw new Error(`查無 ${code} 的資料。目前僅支援「上市」股票與 ETF（上櫃股票不在證交所）。`);

    const c = rows.map(r => r.close);
    const all_ = {
      rows, ma5: sma(c, 5), ma20: sma(c, 20), ma60: sma(c, 60), vma20: sma(rows.map(r => r.vol), 20),
      rsi: rsi(c), kd: kd(rows), macd: macd(c),
    };
    // 只顯示使用者選的區間
    const startDate = `${list[0][0]}-${String(list[0][1]).padStart(2, '0')}-01`;
    const s = Math.max(0, rows.findIndex(r => r.date >= startDate));
    const cut = a => a.slice(s);
    D = {
      code, name: name || '', rows: cut(rows), ma5: cut(all_.ma5), ma20: cut(all_.ma20), ma60: cut(all_.ma60),
      vma20: cut(all_.vma20), rsi: cut(all_.rsi),
      kd: { K: cut(all_.kd.K), D: cut(all_.kd.D) },
      macd: { dif: cut(all_.macd.dif), dea: cut(all_.macd.dea), osc: cut(all_.macd.osc) },
    };
    remember(code, D.name);
    hover = null;
    $('#result').hidden = false;
    renderCards(); renderSignals(); draw(); renderInfo();
    setStatus(`${code} ${D.name}：共 ${D.rows.length} 個交易日，最新資料 ${D.rows.at(-1).date}`);
  } catch (e) {
    if (token === loadToken) setStatus('⚠️ ' + (e.message === 'Failed to fetch' ? '重試 3 次仍無法連線到證交所。可能是請求太頻繁被暫時限流（通常幾分鐘到 20 分鐘會解除），或瀏覽器的廣告阻擋外掛擋住了 twse.com.tw。已抓到的月份都已存入快取，稍後再按一次「分析」會從中斷處接續。' : e.message), true);
  } finally {
    if (token === loadToken) $('#go').disabled = false;
  }
}

function setStatus(t, err) { const el = $('#status'); el.textContent = t; el.className = 'status' + (err ? ' err' : ''); }

// ---------- 自選清單 ----------
const DEFAULTS = [['2330', '台積電'], ['2317', '鴻海'], ['2454', '聯發科'], ['0050', '元大台灣50'], ['2881', '富邦金']];
function remember(code, name) {
  let list = store.get('tw:recent') || DEFAULTS;
  list = [[code, name], ...list.filter(x => x[0] !== code)].slice(0, 10);
  store.set('tw:recent', list); renderChips();
}
function renderChips() {
  const list = store.get('tw:recent') || DEFAULTS;
  $('#chips').innerHTML = list.map(([c, n]) => `<span class="chip" data-code="${c}">${c} ${n || ''}</span>`).join('');
}

// ---------- 摘要卡片 ----------
function renderCards() {
  const r = D.rows, last = r.at(-1), prev = r.at(-2) || last;
  const ch = last.close - prev.close, pct = ch / prev.close * 100;
  const hi = Math.max(...r.map(x => x.high)), lo = Math.min(...r.map(x => x.low));
  const ret = (last.close / r[0].close - 1) * 100;
  const vr = D.vma20.at(-1) ? last.vol / D.vma20.at(-1) : null;
  const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
  const sign = v => (v > 0 ? '+' : '') ;
  $('#cards').innerHTML = [
    ['收盤價 ' + last.date.slice(5), `<span class="${cls(ch)}">${fmt(last.close)}</span>`],
    ['漲跌', `<span class="${cls(ch)}">${sign(ch)}${fmt(ch)} (${sign(pct)}${fmt(pct)}%)</span>`],
    ['區間報酬', `<span class="${cls(ret)}">${sign(ret)}${fmt(ret)}%</span>`],
    ['區間最高 / 最低', `${fmt(hi)} <span style="color:var(--muted);font-size:14px">/ ${fmt(lo)}</span>`],
    ['成交量（張）', `${fmt(last.vol, 0)} <span style="color:var(--muted);font-size:13px">${vr ? '均量 ' + fmt(vr, 1) + ' 倍' : ''}</span>`],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

// ---------- 技術面觀察 ----------
function renderSignals() {
  const n = D.rows.length - 1, c = D.rows[n].close, out = [];
  const add = (type, text) => out.push([type, text]);
  const crossed = (a, b, i) => a[i] != null && b[i] != null && a[i - 1] != null && b[i - 1] != null
    ? (a[i - 1] <= b[i - 1] && a[i] > b[i] ? 'up' : a[i - 1] >= b[i - 1] && a[i] < b[i] ? 'down' : null) : null;

  for (const [lbl, ma] of [['月線 (MA20)', D.ma20], ['季線 (MA60)', D.ma60]]) {
    const v = ma[n]; if (v == null) continue;
    const d = (c / v - 1) * 100;
    add(c >= v ? 'bull' : 'bear', `收盤價位於${lbl}${c >= v ? '之上' : '之下'}（${fmt(v)}，乖離 ${d >= 0 ? '+' : ''}${fmt(d)}%）`);
  }
  if (D.ma5[n] && D.ma20[n] && D.ma60[n]) {
    if (D.ma5[n] > D.ma20[n] && D.ma20[n] > D.ma60[n]) add('bull', '均線多頭排列（MA5 > MA20 > MA60）');
    else if (D.ma5[n] < D.ma20[n] && D.ma20[n] < D.ma60[n]) add('bear', '均線空頭排列（MA5 < MA20 < MA60）');
    else add('neu', '均線糾結，未形成明確排列');
  }
  for (let i = n; i > n - 5 && i > 0; i--) {
    const x = crossed(D.ma5, D.ma20, i);
    if (x) { add(x === 'up' ? 'bull' : 'bear', `${D.rows[i].date.slice(5)} MA5 ${x === 'up' ? '向上穿越' : '向下跌破'} MA20（${x === 'up' ? '黃金' : '死亡'}交叉）`); break; }
  }
  const K = D.kd.K[n], Dd = D.kd.D[n];
  if (K != null) {
    const x = crossed(D.kd.K, D.kd.D, n);
    add(K > 80 ? 'bear' : K < 20 ? 'bull' : 'neu',
      `KD：K=${fmt(K, 1)}、D=${fmt(Dd, 1)}${K > 80 ? '，位於 80 以上高檔區' : K < 20 ? '，位於 20 以下低檔區' : ''}${x ? `，今日${x === 'up' ? '黃金' : '死亡'}交叉` : ''}`);
  }
  const R = D.rsi[n];
  if (R != null) add(R > 70 ? 'bear' : R < 30 ? 'bull' : 'neu', `RSI(14) = ${fmt(R, 1)}${R > 70 ? '，進入超買區（>70）' : R < 30 ? '，進入超賣區（<30）' : '，位於中性區間'}`);
  const o = D.macd.osc;
  if (o[n] != null) {
    const flip = o[n - 1] != null && Math.sign(o[n]) !== Math.sign(o[n - 1]);
    add(o[n] > 0 ? 'bull' : 'bear', `MACD 柱狀體${o[n] > 0 ? '為正' : '為負'}（${fmt(o[n])}）${flip ? '，今日翻' + (o[n] > 0 ? '正' : '負') : o[n - 1] != null ? (Math.abs(o[n]) > Math.abs(o[n - 1]) ? '，幅度擴大中' : '，幅度收斂中') : ''}`);
  }
  const vr = D.vma20[n] ? D.rows[n].vol / D.vma20[n] : null;
  if (vr != null) add('neu', `今日成交量為 20 日均量的 ${fmt(vr, 2)} 倍${vr > 1.5 ? '（明顯放量）' : vr < 0.6 ? '（明顯量縮）' : ''}`);

  const label = { bull: '偏多', bear: '偏空', neu: '中性' };
  $('#signals').innerHTML = out.map(([t, s]) => `<li><span class="tag ${t}">${label[t]}</span><span>${s}</span></li>`).join('');
}

// ---------- 十字線資訊 ----------
function renderInfo() {
  if (!D) return;
  const i = hover ?? D.rows.length - 1, r = D.rows[i], p = D.rows[i - 1];
  const cls = p ? (r.close > p.close ? 'up' : r.close < p.close ? 'down' : '') : '';
  const extra = ind === 'KD' ? `K <b>${fmt(D.kd.K[i], 1)}</b> D <b>${fmt(D.kd.D[i], 1)}</b>`
    : ind === 'RSI' ? `RSI <b>${fmt(D.rsi[i], 1)}</b>`
    : `DIF <b>${fmt(D.macd.dif[i])}</b> DEA <b>${fmt(D.macd.dea[i])}</b> OSC <b>${fmt(D.macd.osc[i])}</b>`;
  $('#info').innerHTML = `
    <span><b>${D.code} ${D.name}</b> ${r.date}</span>
    <span>開 <b>${fmt(r.open)}</b></span><span>高 <b>${fmt(r.high)}</b></span>
    <span>低 <b>${fmt(r.low)}</b></span><span>收 <b class="${cls}">${fmt(r.close)}</b></span>
    <span>量 <b>${fmt(r.vol, 0)}</b> 張</span>
    <span class="legend"><i style="background:var(--ma5)"></i>MA5 <b>${fmt(D.ma5[i])}</b></span>
    <span class="legend"><i style="background:var(--ma20)"></i>MA20 <b>${fmt(D.ma20[i])}</b></span>
    <span class="legend"><i style="background:var(--ma60)"></i>MA60 <b>${fmt(D.ma60[i])}</b></span>
    <span>${extra}</span>`;
}

// ---------- 繪圖 ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let geo = null;
function draw() {
  const cv = $('#chart'), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  if (!D) return;
  const C = { up: css('--up'), down: css('--down'), line: css('--line'), muted: css('--muted'),
    ma5: css('--ma5'), ma20: css('--ma20'), ma60: css('--ma60'), accent: css('--accent') };
  const rows = D.rows, n = rows.length, L = 6, R = 58, pw = W - L - R;
  const pTop = 8, pH = H * 0.56, vTop = pTop + pH + 12, vH = H * 0.13, iTop = vTop + vH + 12, iH = H - iTop - 22;
  const bw = pw / n, X = i => L + bw * (i + 0.5);
  geo = { L, pw, bw, n, top: pTop, bottom: iTop + iH };
  g.font = '11px "Segoe UI", sans-serif'; g.textBaseline = 'middle';

  // 價格
  let hi = -Infinity, lo = Infinity;
  rows.forEach((r, i) => { hi = Math.max(hi, r.high); lo = Math.min(lo, r.low);
    for (const m of [D.ma5, D.ma20, D.ma60]) if (m[i] != null) { hi = Math.max(hi, m[i]); lo = Math.min(lo, m[i]); } });
  const padP = (hi - lo) * 0.06 || 1; hi += padP; lo -= padP;
  const Y = v => pTop + (hi - v) / (hi - lo) * pH;
  grid(g, pTop, pH, hi, lo, 5, W, R, C, v => fmt(v, v >= 100 ? 0 : 2));

  const body = Math.max(1, Math.min(12, bw * 0.7));
  rows.forEach((r, i) => {
    const col = r.close > r.open ? C.up : r.close < r.open ? C.down : C.muted;
    g.strokeStyle = g.fillStyle = col;
    g.beginPath(); g.moveTo(X(i), Y(r.high)); g.lineTo(X(i), Y(r.low)); g.stroke();
    const y1 = Y(Math.max(r.open, r.close)), y2 = Y(Math.min(r.open, r.close));
    g.fillRect(X(i) - body / 2, y1, body, Math.max(1, y2 - y1));
  });
  line(g, D.ma5, X, Y, C.ma5); line(g, D.ma20, X, Y, C.ma20); line(g, D.ma60, X, Y, C.ma60);

  // 成交量
  const vmax = Math.max(...rows.map(r => r.vol)) || 1;
  rows.forEach((r, i) => {
    const p = rows[i - 1];
    g.fillStyle = (p && r.close < p.close) ? C.down : C.up; g.globalAlpha = .7;
    const h = r.vol / vmax * vH; g.fillRect(X(i) - body / 2, vTop + vH - h, body, h);
  });
  g.globalAlpha = 1;
  line(g, D.vma20, X, v => vTop + vH - v / vmax * vH, C.muted);
  g.fillStyle = C.muted; g.textAlign = 'left'; g.fillText(fmt(vmax, 0) + ' 張', W - R + 6, vTop + 6);

  // 指標
  if (ind === 'MACD') {
    const { dif, dea, osc } = D.macd;
    const m = Math.max(...[...dif, ...dea, ...osc].filter(v => v != null).map(Math.abs)) || 1;
    const IY = v => iTop + iH / 2 - v / m * iH / 2;
    grid(g, iTop, iH, m, -m, 2, W, R, C, v => fmt(v, 1));
    osc.forEach((v, i) => { if (v == null) return; g.fillStyle = v >= 0 ? C.up : C.down; g.globalAlpha = .75;
      g.fillRect(X(i) - body / 2, Math.min(IY(v), IY(0)), body, Math.abs(IY(v) - IY(0))); });
    g.globalAlpha = 1; line(g, dif, X, IY, C.ma5); line(g, dea, X, IY, C.accent);
  } else {
    const IY = v => iTop + (100 - v) / 100 * iH;
    const lv = ind === 'KD' ? [20, 80] : [30, 70];
    grid(g, iTop, iH, 100, 0, 2, W, R, C, v => v.toFixed(0));
    g.setLineDash([4, 4]); g.strokeStyle = C.muted; g.globalAlpha = .5;
    for (const v of lv) { g.beginPath(); g.moveTo(L, IY(v)); g.lineTo(W - R, IY(v)); g.stroke();
      g.fillStyle = C.muted; g.fillText(v, W - R + 6, IY(v)); }
    g.setLineDash([]); g.globalAlpha = 1;
    if (ind === 'KD') { line(g, D.kd.K, X, IY, C.ma5); line(g, D.kd.D, X, IY, C.accent); }
    else line(g, D.rsi, X, IY, C.ma20);
  }
  g.fillStyle = C.muted; g.textAlign = 'left'; g.fillText(ind, L + 4, iTop + 8);

  // 日期軸（每月一個標籤）
  g.textAlign = 'center';
  let lastM = null;
  rows.forEach((r, i) => { const m = r.date.slice(0, 7); if (m !== lastM) { lastM = m;
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(X(i), pTop); g.lineTo(X(i), iTop + iH); g.stroke();
    g.fillStyle = C.muted; g.textAlign = X(i) < 24 ? 'left' : 'center';
    g.fillText(r.date.slice(2, 7).replace('-', '/'), Math.max(X(i), L), H - 9); } });

  // 十字線
  if (hover != null) {
    g.strokeStyle = C.muted; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(X(hover), pTop); g.lineTo(X(hover), iTop + iH); g.stroke(); g.setLineDash([]);
    const yc = Y(rows[hover].close);
    g.beginPath(); g.moveTo(L, yc); g.lineTo(W - R, yc); g.stroke();
    g.fillStyle = C.accent; g.fillRect(W - R + 1, yc - 9, R - 2, 18);
    g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(fmt(rows[hover].close), W - R + 5, yc);
  }
}
function grid(g, top, h, hi, lo, steps, W, R, C, f) {
  g.textAlign = 'left';
  for (let k = 0; k <= steps; k++) {
    const v = hi - (hi - lo) * k / steps, y = top + h * k / steps;
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(6, y); g.lineTo(W - R, y); g.stroke();
    g.fillStyle = C.muted; g.fillText(f(v), W - R + 6, y);
  }
}
function line(g, arr, X, Y, color) {
  g.strokeStyle = color; g.lineWidth = 1.4; g.beginPath(); let on = false;
  arr.forEach((v, i) => { if (v == null) { on = false; return; } on ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); on = true; });
  g.stroke(); g.lineWidth = 1;
}

// ---------- 事件 ----------
$('#go').onclick = () => analyze($('#code').value);
$('#code').onkeydown = e => { if (e.key === 'Enter') analyze($('#code').value); };
$('#chips').onclick = e => { const c = e.target.closest('.chip'); if (c) analyze(c.dataset.code); };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  ind = b.dataset.ind; [...$('#tabs').children].forEach(x => x.classList.toggle('on', x === b)); draw(); renderInfo(); };
const cv = $('#chart');
function onMove(clientX) {
  if (!D || !geo) return;
  const x = clientX - cv.getBoundingClientRect().left;
  const i = Math.floor((x - geo.L) / geo.bw);
  const h = i >= 0 && i < geo.n ? i : null;
  if (h !== hover) { hover = h; draw(); renderInfo(); }
}
cv.addEventListener('mousemove', e => onMove(e.clientX));
cv.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
cv.addEventListener('mouseleave', () => { hover = null; draw(); renderInfo(); });
addEventListener('resize', () => draw());

renderChips();
</script>
</body>
